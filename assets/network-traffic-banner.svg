<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Network Traffic Analysis Lab — Wireshark, Kali Linux, Blue Team</title>
<desc id="desc">Dark blue and purple technical cover showing the investigation sequence ICMP and DNS, TCP handshake, and TLS 1.3 with HTTPS.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#081728"/><stop offset="55%" stop-color="#09192a"/><stop offset="100%" stop-color="#11133a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#45e0ea"/><stop offset="58%" stop-color="#50a9ff"/><stop offset="100%" stop-color="#af72ff"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#132c47" stop-opacity=".95"/><stop offset="100%" stop-color="#0a2038" stop-opacity=".95"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0%" stop-color="#12b9e6" stop-opacity=".28"/><stop offset="100%" stop-color="#12b9e6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#80a3d1" stroke-width="1" opacity=".12"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L10 6 2 11" fill="none" stroke="#56ccea" stroke-width="2"/></marker>
</defs>
